<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radar screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;900&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#bdbdbd}a:hover{color:#ffffff}
.seg{display:flex;padding:3px;border-radius:22px;background:rgba(11,11,11,0.8);box-shadow:0 0 0 1px #222222;pointer-events:auto}
.sb{height:38px;min-width:78px;padding:0 16px;border-radius:19px;border:0;background:transparent;color:#8E8E8E;font:500 13px Inter,system-ui,sans-serif;cursor:pointer}
.area .b1,.region .b2{background:#DDDDDD;color:#0B0B0B}
</style>
</helmet>
<div style="width: 700px; height: 860px; box-sizing: border-box; padding: 40px 40px 0; background: #111111; display: flex; flex-direction: column; align-items: center; gap: 18px; font-family: Inter, system-ui, sans-serif; color: #ffffff">
<div style="position: relative; width: 620px; height: 722px; flex-shrink: 0; border-radius: 36px; overflow: hidden; background: #0B0B0B; color: #DDDDDD; box-shadow: 0 0 0 1px #2c2c2c">
<canvas id="dh-radar-cv" ref="{{ setCanvas }}" onPointerDown="{{ toggle }}" role="img" aria-label="Sample radar map drawn in dots around Chicago" style="position: absolute; left: 0; top: 0; width: 620px; height: 722px; display: block; cursor: pointer"></canvas>
<div style="position: absolute; left: 0; top: 0; width: 620px; height: 120px; background: linear-gradient(180deg, rgba(11,11,11,0.92) 0%, rgba(11,11,11,0.6) 60%, rgba(11,11,11,0) 100%); pointer-events: none"></div>
<div style="position: absolute; left: 28px; top: 30px; display: flex; flex-direction: column; gap: 4px; pointer-events: none">
<div style="font-size: 20px; font-weight: 600">Radar</div>
<div style="font-size: 13px; color: #8E8E8E">Chicago · sample echo, not live</div>
</div>
<div class="seg {{ viewClass }}" style="position: absolute; right: 24px; top: 30px">
<button class="sb b1" onClick="{{ showArea }}">Area</button>
<button class="sb b2" onClick="{{ showRegion }}">Region</button>
</div>
<div style="position: absolute; right: 26px; top: 668px; display: flex; align-items: center; gap: 8px; font-size: 11px; color: #8E8E8E; letter-spacing: 1px; pointer-events: none">
<div>LIGHT</div>
<div style="width: 3px; height: 3px; border-radius: 50%; background: #DDDDDD; opacity: 0.6"></div>
<div style="width: 5px; height: 5px; border-radius: 50%; background: #DDDDDD; opacity: 0.8"></div>
<div style="width: 7px; height: 7px; border-radius: 50%; background: #DDDDDD"></div>
<div>HEAVY</div>
</div>
</div>
<div style="font-size: 12px; color: #a0a0a0; text-align: center; line-height: 1.5; max-width: 600px">Tap the map or the buttons to switch views. The storm is made up and the roads are approximate. The real screen would use NWS radar via Iowa State's Mesonet and real map data.</div>
</div>
</x-dc>
