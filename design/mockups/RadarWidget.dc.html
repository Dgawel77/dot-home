<helmet>

    const clear = (r) => {

        for (let i = Math.max(0, Math.ceil(r[0] / S)); i <= Math.min(NI, Math.floor((r[0] + r[2]) / S)); i++) off[j * N1 + i] = 1;
      }
    };
    const city = (c, force) => {
      const x = Math.round(p.x(c[2]) / S) * S, y = Math.round(p.y(c[1]) / S) * S, me = c[0] === 'Chicago', s = c[0].toUpperCase();
      const r = [x + 6, y - 8, tw(s) + 4, 16];
      if (!force && hit(r)) return;
      if (x < 4 || y < 4 || x > W - 4 || y > H - 4) return;
      rects.push(r); clear(r);
      if (!me) { const q = (y / S) * N1 + x / S; code[q] = 7; off[q] = 0; }
      texts.push([s, x + 8, y + 4, me ? '#DDDDDD' : '#A6A6A6', 'left']);
    };
    for (const c of v.cities) if (c[0] === 'Chicago') city(c, true);
    for (const l of v.labels) {
      const x = Math.round(p.x(l[2]) / S) * S, y = Math.round(p.y(l[1]) / S) * S, w = tw(l[0]);
      const r = [x - w / 2 - 2, y - 12, w + 4, 16];
      if (hit(r)) continue;
      rects.push(r); clear(r);
      texts.push([l[0], x, y, '#757575', 'center']);
    }
    for (const rd of v.roads) {
      const m = rd[1][Math.floor(rd[1].length / 2)];
      const cx = Math.round(p.x(m[1]) / S) * S, cy = Math.round(p.y(m[0]) / S) * S;
      const hw = Math.ceil((tw(rd[0]) / 2 + 5) / S) * S, box = [cx - hw, cy - 8, hw * 2, 16];
      if (hit(box)) continue;
      rects.push(box);
      const i0 = (cx - hw) / S, i1 = (cx + hw) / S, j0 = (cy - 8) / S, j1 = (cy + 8) / S;
      for (let j = j0; j <= j1; j++) {
        for (let i = i0; i <= i1; i++) {
          const q = j * N1 + i;
          if (j === j0 || j === j1 || i === i0 || i === i1) { code[q] = 8; off[q] = 0; } else off[q] = 1;
        }
      }
      texts.push([rd[0], cx, cy + 4, '#A6A6A6', 'center']);
    }
    for (const c of v.cities) if (c[0] !== 'Chicago') city(c, false);
    this._bases[key] = { code: code, off: off, texts: texts, Z: Z, N1: N1, NI: NI, NJ: NJ };
    return this._bases[key];
  }
  // The storm through the halftone filter: contrast stretch (fixed range so frames don't pump), b < 10% skipped later
  _storm(d, p, NI, NJ, N1, m) {
    const n = N1 * (NJ + 1);
    if (!this._sfBuf || this._sfBuf.length !== n) this._sfBuf = new Float32Array(n);
    const out = this._sfBuf;
    const cur = d.cells.map((c) => [c[0] + 0.12 * (m / 60), c[1] + 0.5 * (m / 60), 2 * c[2] * c[2], c[3]]);
    const lon = new Float32Array(NI + 1);
    for (let i = 0; i <= NI; i++) lon[i] = p.lon(i * 4);
    for (let j = 0; j <= NJ; j++) {
      const lat = p.lat(j * 4), cl = Math.cos((lat * Math.PI) / 180);
      for (let i = 0; i <= NI; i++) {
        let I = 0;
        for (let k = 0; k < cur.length; k++) {
          const c = cur[k], dy = lat - c[0], dx = (lon[i] - c[1]) * cl, q = (dx * dx + dy * dy) / c[2];
          if (q < 6) I += c[3] * Math.exp(-q);
        }
        if (I > 0) I *= 0.85 + 0.15 * Math.sin(lat * 41 + lon[i] * 29 + m * 0.05);
        const b = I / 1.15;
        out[j * N1 + i] = b > 1 ? 1 : b;
      }
    }
    return out;
  }
  // Draws the map cells, the storm and the label text. Storm cells win over map cells; route boxes win over the storm.
  _drawMap(ctx, put, B, sf) {
    const L = this._L(), S = 4;
    const SZ = [0, 1.2, 1.2, 1.2, 2.4, 2.4, 2.4, 2.4, 2.4], AL = [0, L.L46, L.L46, L.L46, L.L46, L.L46, L.L46, L.L65, L.L46];
    for (let j = 0; j <= B.NJ; j++) {
      for (let i = 0; i <= B.NI; i++) {
        const q = j * B.N1 + i;
        if (B.off[q]) continue;
        const c = B.code[q];
        if (c === 8) { put(i * S, j * S, 2.4, L.L46); continue; }
        const b = sf[q];
        if (b >= 0.1) { put(i * S, j * S, Math.sqrt(b) * 0.85 * S, L.L100); continue; }
        if (c) put(i * S, j * S, SZ[c], AL[c]);
      }
    }
  }
  // A still widget: the latest storm frame, the location dot and a readout in a clear zone, no rounded corners
  _draw(ctx, dpr, W, H, key) {
    const d = this._data(), v = d.area, p = this._proj(v, W, H), L = this._L(), put = this._batch();
    const zones = [[12, H - 44, 176, 32]];
    const B = this._mapBase(key, v, p, W, H, zones);
    const sf = this._storm(d, p, B.NI, B.NJ, B.N1, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1; ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, W, H);
    this._drawMap(ctx, put, B, sf);
    const lx = Math.round(p.x(-87.63) / 4) * 4, ly = Math.round(p.y(41.88) / 4) * 4;
    put(lx, ly, 3.4, L.L100);
    for (let i = 0; i < 16; i++) { const a = (i / 16) * 6.2832; put(lx + Math.cos(a) * 10, ly + Math.sin(a) * 10, 1.2, L.L46); }
    const t = this._hhmm(new Date());
    this._mxDraw(put, t, 68, H - 40, 4, L.L65, 0, 0.6);
    put.flush(ctx);
    for (const tx of B.texts) this._lbl(ctx, tx[0], tx[1], tx[2], tx[3], tx[4]);
    this._lbl(ctx, 'RADAR', 16, H - 24, '#A6A6A6', 'left');
    ctx.globalAlpha = 1;
  }
  renderVals() {
    if (!this._h) {
      this._h = {
        setMain: (el) => { if (el) this._paint(el, false); },
        setCover: (el) => { if (el) this._paint(el, false); }
      };
    }
    return { setMain: this._h.setMain, setCover: this._h.setCover };
  }
}
</script>
