<title>Radar widget</title>

<helmet>

</helmet>

<a class="rw" href="Radar.dc.html" aria-label="Open the full radar" style="width: 580px; height: 420px; border-radius: 28px">
<canvas id="dh-rw-main" ref="{{ setMain }}" role="img" aria-label="Radar widget at main screen size: a sample storm west of Chicago drawn in dots" style="width: 580px; height: 420px; display: block"></canvas>
</a>
<div style="display: flex; align-items: flex-start; gap: 24px">
<a class="rw" href="Radar.dc.html" aria-label="Open the full radar" style="width: 300px; height: 330px; border-radius: 26px">
<canvas id="dh-rw-cover" ref="{{ setCover }}" role="img" aria-label="Radar widget at cover screen size: a sample storm west of Chicago drawn in dots" style="width: 300px; height: 330px; display: block"></canvas>
</a>
<div style="display: flex; flex-direction: column; gap: 12px; padding-top: 4px; font-size: 13px; color: #a0a0a0; line-height: 1.5">
<div style="font-size: 14px; font-weight: 500; color: #d6d6d6">Radar widget · 4×3</div>
<div>Above: main screen size. Left: cover screen size.</div>
<div>Tap opens the full radar. Refreshes every 15 min while placed.</div>
<div>It shows the latest frame of the sample storm. The location dot holds still.</div>
</div>
</div>
</div>
