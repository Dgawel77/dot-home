<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover home screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A6A6A6}a:hover{color:#DDDDDD}
.lb{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;line-height:16px;letter-spacing:1px;text-transform:uppercase;color:#A6A6A6;white-space:nowrap}
.ico{fill:none;stroke:#DDDDDD;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ico *{vector-effect:non-scaling-stroke}
.ic{width:56px;height:56px;display:flex;align-items:center;justify-content:center;border:0;border-radius:0;background:transparent;padding:0;cursor:pointer;pointer-events:auto}
.mb{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;padding:0;cursor:pointer;pointer-events:auto}
.mb:hover{background:#1A1A1A}
.shk{width:84px;height:32px;flex-shrink:0;border-radius:16px;border:0;background:#1A1A1A;color:#DDDDDD;font:500 13px Inter,system-ui,sans-serif;cursor:pointer}
sc-for,sc-if{display:contents}
</style>
</helmet>
<div style="width: 410px; height: 940px; box-sizing: border-box; padding: 32px 40px 0; background: #111111; display: flex; flex-direction: column; align-items: center; gap: 12px; font-family: Inter, system-ui, sans-serif; color: #DDDDDD">
<div style="position: relative; width: 330px; height: 810px; flex-shrink: 0; border-radius: 34px; overflow: hidden; background: #000000; color: #DDDDDD; box-shadow: 0 0 0 1px #2c2c2c" onPointerMove="{{ onMove }}" onPointerLeave="{{ onLeave }}">
<canvas id="dh-cover-cv" ref="{{ setCanvas }}" onPointerDown="{{ onTap }}" role="img" aria-label="Dot space shooter wallpaper" style="position: absolute; left: 0; top: 0; width: 330px; height: 810px; display: block; touch-action: none; cursor: crosshair"></canvas>
<canvas id="dh-cover-wg" ref="{{ setWg }}" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 330px; height: 810px; display: block; pointer-events: none"></canvas>
<div style="position: absolute; left: 0; top: 0; width: 330px; height: 810px; pointer-events: none">
<div class="lb" style="position: absolute; left: 16px; top: 16px">TODAY {{ score }} · BEST {{ best }}</div>
<div role="img" aria-label="{{ time }}" style="position: absolute; left: 16px; top: 48px; width: 200px; height: 56px"></div>
<div style="position: absolute; left: 16px; top: 112px; font-size: 15px; line-height: 20px; color: #A6A6A6; white-space: nowrap">{{ date }}</div>
<div role="img" aria-label="41 degrees" style="position: absolute; left: 254px; top: 58px; width: 68px; height: 28px"></div>
<div style="position: absolute; right: 8px; top: 94px; width: 102px; font-size: 13px; line-height: 16px; color: #A6A6A6; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Cloudy · H 45° L 33°</div>
<div style="position: absolute; right: 8px; top: 110px; width: 102px; font-size: 13px; line-height: 16px; color: #757575; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Chicago</div>
<canvas id="dh-cover-art" ref="{{ setArt }}" role="img" aria-label="Album art redrawn in dots" style="position: absolute; left: 16px; top: 600px; width: 64px; height: 64px; display: block"></canvas>
<div style="position: absolute; left: 96px; top: 608px; width: 96px; font-size: 15px; line-height: 20px; font-weight: 500; color: #DDDDDD; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Track name</div>
<div style="position: absolute; left: 96px; top: 628px; width: 96px; font-size: 13px; line-height: 16px; color: #A6A6A6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Artist</div>
<div role="img" aria-label="Track progress: 38 percent" style="position: absolute; left: 94px; top: 652px; width: 96px; height: 8px"></div>
<div style="position: absolute; left: 196px; top: 610px; display: flex">
<button class="mb" aria-label="Previous track"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6v12M18 6l-8 6 8 6z"></path></svg></button>
<button class="mb" aria-label="{{ playLabel }}" onClick="{{ togglePlay }}">
<sc-if value="{{ playing }}" hint-placeholder-val="{{ false }}"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"></path></svg></sc-if>
<sc-if value="{{ paused }}" hint-placeholder-val="{{ true }}"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"></path></svg></sc-if>
</button>
<button class="mb" aria-label="Next track"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 6v12M6 6l8 6-8 6z"></path></svg></button>
</div>
<div style="position: absolute; left: 16px; top: 724px; display: flex; gap: 24px">
<button class="ic" aria-label="Messages"><canvas id="dh-cover-ic-messages" ref="{{ setIcon }}" width="56" height="56" aria-hidden="true" style="width: 56px; height: 56px; display: block"></canvas></button>
<button class="ic" aria-label="Mail"><canvas id="dh-cover-ic-mail" ref="{{ setIcon }}" width="56" height="56" aria-hidden="true" style="width: 56px; height: 56px; display: block"></canvas></button>
<button class="ic" aria-label="Browser"><canvas id="dh-cover-ic-browser" ref="{{ setIcon }}" width="56" height="56" aria-hidden="true" style="width: 56px; height: 56px; display: block"></canvas></button>
<button class="ic" aria-label="Music"><canvas id="dh-cover-ic-music" ref="{{ setIcon }}" width="56" height="56" aria-hidden="true" style="width: 56px; height: 56px; display: block"></canvas></button>
</div>
</div>
</div>
<div style="width: 330px; display: flex; align-items: flex-start; gap: 12px">
<button class="shk" aria-label="Shake" onClick="{{ shake }}">{{ shakeText }}</button>
<div style="font-size: 13px; line-height: 18px; color: #A6A6A6">The ship flies itself · move the pointer to tilt · click to shoot · Shake sends a shockwave (8 s cooldown here, 60 s on the phone)</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"rockStyle":{"editor":"enum","default":"lattice","options":["lattice","outline"],"section":"Game"},"$preview":{"width":410,"height":940}}'>
class Component extends DCLogic {
  _dims() {
    return { W: 330, H: 810, ROCKS: 5, R: 26, CID: 'dh-cover-cv', WID: 'dh-cover-wg', AID: 'dh-cover-art', IP: 'dh-cover-ic-', IC: 56,
      ICONS: ['messages', 'mail', 'browser', 'music'],

  }
  componentDidMount() {
    this.D = this._dims();
    this._alive = true;
    this._clock = setInterval(() => { this.setState({ now: Date.now() }); this._paintWg(); }, 10000);
    this._onOri = (e) => {
      const g = this._g;
      if (!g || e.gamma == null || e.beta == null) return;
      if (!g.ori) g.ori = { g0: e.gamma, b0: e.beta };
      g.oriOn = true;
      g.tilt.x = this._cl((e.gamma - g.ori.g0) / 22, -1, 1);
      g.tilt.y = this._cl((e.beta - g.ori.b0) / 22, -1, 1);
    };
    try { window.addEventListener('deviceorientation', this._onOri); } catch (err) {}
    this._findCanvas(0);
    this._findIcons(0);
    setTimeout(() => { if (this._alive) { this._paintArt(this._art || document.getElementById(this.D.AID)); this._paintWg(); } }, 200);
  }
  componentDidUpdate() { this._paintWg(); }
  componentWillUnmount() {

    clearInterval(this._clock);
    try { window.removeEventListener('deviceorientation', this._onOri); } catch (err) {}
  }
  _cl(v, a, b) { return v < a ? a : v > b ? b : v; }

  _L() { return this._lv || (this._lv = { L100: 1, L65: 0.75, L46: 0.53, L10: 0.12 }); }

      if (!(d > 0.3) || !(a > 0.005)) return;

  // The app's 5x7 matrix font (DotMatrixFont): digits and symbols share one 5-column advance, the colon is one column
  _mxF() {

  }
  // Draws a numeral string; (x0, y0) is the centre of the top-left cell, s the step. grid > 0 also draws unlit cells.
  _mxDraw(put, str, x0, y0, s, lit, grid, wt) {

    for (const ch of String(str)) {
      const rows = F[ch];
      if (!rows) continue;

        for (let c = 0; c < w; c++) {

  _hhmm(d) { let h = d.getHours() % 12; if (h === 0) h = 12; return String(h).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

    const lo = a < 0.12 ? a : 0.12;

  }
  // Rasterises a polygon onto the fixed 4 px lattice. Rim cells: regular weight x coverage; interior: light weight.

    const S = 4, n = poly.length;
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (let k = 0; k < n; k++) { const p = poly[k]; if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0]; if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1]; }
    const NI = Math.floor(W / S), NJ = Math.floor(H / S);
    const i0 = Math.max(0, Math.ceil((x0 - 2) / S)), i1 = Math.min(NI, Math.floor((x1 + 2) / S));
    const j0 = Math.max(0, Math.ceil((y0 - 2) / S)), j1 = Math.min(NJ, Math.floor((y1 + 2) / S));
    for (let j = j0; j <= j1; j++) {
      const cy = j * S;
      for (let i = i0; i <= i1; i++) {
        if (Z && Z.mask[j * Z.N1 + i]) continue;
        const cx = i * S;
        let ins = false, dm = 1e9;
        for (let k = 0, l = n - 1; k < n; l = k++) {
          const ax = poly[l][0], ay = poly[l][1], bx = poly[k][0], by = poly[k][1], ex = bx - ax, ey = by - ay;
          if ((ay > cy) !== (by > cy) && cx < (ex * (cy - ay)) / ey + ax) ins = !ins;
          const wx = cx - ax, wy = cy - ay, ee = ex * ex + ey * ey;
          let u = ee > 0 ? (wx * ex + wy * ey) / ee : 0;
          u = u < 0 ? 0 : u > 1 ? 1 : u;
          const dx = wx - ex * u, dy = wy - ey * u, d2 = dx * dx + dy * dy;
          if (d2 < dm) dm = d2;
        }
        const sd = ins ? -Math.sqrt(dm) : Math.sqrt(dm);
        if (sd >= S / 2) continue;
        if (solid || sd > -S) { const cov = 0.5 - sd / S; put(cx, cy, 0.6 * S * (cov > 1 ? 1 : cov), a); }
        else put(cx, cy, 0.3 * S, a);
      }
    }
  }
  _findCanvas(n) {
    if (!this._alive) return;
    if (!this._cv) { const el = document.getElementById(this.D.CID); if (el) this._cv = el; }
    if (this._cv) { this._start(); return; }
    if (n < 40) setTimeout(() => this._findCanvas(n + 1), 100);
  }
  _findIcons(n) {
    if (!this._alive) return;
    const D = this.D || this._dims();
    let left = 0;
    for (const name of D.ICONS) {
      const el = document.getElementById(D.IP + name);
      if (el) this._paintIcon(el); else left++;
    }
    if (left && n < 40) setTimeout(() => this._findIcons(n + 1), 100);
  }
  _icShape(x, name) {
    const grey = (L) => { const v = Math.round(L * 255); return 'rgb(' + v + ',' + v + ',' + v + ')'; };
    const rr = (x0, y0, w, h, r) => { x.beginPath(); x.moveTo(x0 + r, y0); x.arcTo(x0 + w, y0, x0 + w, y0 + h, r); x.arcTo(x0 + w, y0 + h, x0, y0 + h, r); x.arcTo(x0, y0 + h, x0, y0, r); x.arcTo(x0, y0, x0 + w, y0, r); x.closePath(); };
    if (name === 'messages') {
      x.fillStyle = grey(0.45);
      rr(98, 104, 236, 184, 60); x.fill();
      x.beginPath(); x.moveTo(134, 262); x.lineTo(112, 336); x.lineTo(198, 280); x.closePath(); x.fill();
    } else if (name === 'phone') {
      x.save(); x.translate(64, 56); x.scale(14.2, 14.2); x.fillStyle = grey(0.6);
      x.fill(new Path2D('M5 3.5h3l1.5 4-2 1.2a11 11 0 0 0 5.8 5.8l1.2-2 4 1.5v3a2 2 0 0 1-2 2A16 16 0 0 1 3 5.5a2 2 0 0 1 2-2z'));
      x.restore();
    } else if (name === 'mail') {
      rr(96, 128, 240, 176, 22); x.fillStyle = grey(0.8); x.fill();
      x.save(); rr(96, 128, 240, 176, 22); x.clip();
      x.beginPath(); x.moveTo(96, 128); x.lineTo(336, 128); x.lineTo(216, 230); x.closePath(); x.fillStyle = grey(0.4); x.fill();
      x.restore();
    } else if (name === 'browser') {
      const L = [0.35, 0.6, 0.85], step = (2 * Math.PI) / 3;
      for (let i = 0; i < 3; i++) { const a0 = -Math.PI / 2 + i * step; x.beginPath(); x.moveTo(216, 216); x.arc(216, 216, 122, a0, a0 + step); x.closePath(); x.fillStyle = grey(L[i]); x.fill(); }

      x.beginPath(); x.arc(216, 216, 46, 0, 2 * Math.PI); x.fillStyle = grey(0.5); x.fill();

      x.beginPath(); x.arc(216, 216, 122, 0, 2 * Math.PI); x.fillStyle = grey(0.3); x.fill();

  _icDots(name) {

      const x0 = this._cl(Math.ceil(cx - B - 0.5), 0, S), x1 = this._cl(Math.floor(cx + B - 0.5) + 1, 0, S);
      const y0 = this._cl(Math.ceil(cy - B - 0.5), 0, S), y1 = this._cl(Math.floor(cy + B - 0.5) + 1, 0, S);

    };

      const x0 = c0 + (j % 2 ? P / 2 : 0);
      const i0 = Math.ceil((lo - x0) / P - 1e-9), i1 = Math.floor((hi - x0) / P + 1e-9);

        const t = (0.38 + 0.57 * L) * (1 - (0.12 * (cx + cy)) / (2 * S));

  }
  _paintIcon(el) {
    if (!el || !el.id) return;

    const name = el.id.slice(D.IP.length);
    if (D.ICONS.indexOf(name) < 0) return;
    const dpr = this._cl(window.devicePixelRatio || 1, 1, 4), px = Math.round(D.IC * dpr);

    c.fill();

  // The widgets (clock, temperature, progress row) are still bitmaps on the phone, so they sit on their own canvas.
  // At this 330 px width the app's weather half is too narrow for its icon, so (like the app) none is drawn.
  _paintWg() {
    const D = this.D || this._dims();
    const el = this._wg || document.getElementById(D.WID);
    if (!el) return;
    this._wg = el;
    const dpr = Math.min(2, window.devicePixelRatio || 1), t = this._hhmm(new Date()), key = t + '|' + dpr;

      const q = rg.t / 0.8, rad = 8 + q * 56, n = 28;

      ctx.beginPath();

  }

        setIcon: (el) => { if (el) this._paintIcon(el); }

    const date = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

    return {
      setCanvas: this._h.setCanvas, setWg: this._h.setWg, onMove: this._h.onMove, onLeave: this._h.onLeave, onTap: this._h.onTap, togglePlay: this._h.togglePlay, setArt: this._h.setArt,
      setIcon: this._h.setIcon, shake: this._h.shake, shakeText: left > 0 ? 'Shake · ' + left + ' s' : 'Shake',
      time: this._hhmm(d), date: date, score: st.score || 0, best: st.best || 0,

  }
}
