<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover home screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;900&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#bdbdbd}a:hover{color:#ffffff}
.doto{font-family:'Doto',ui-monospace,monospace}
.ico{fill:none;stroke:#DDDDDD;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icof{fill:#DDDDDD;stroke:none}
.w{pointer-events:auto;border-radius:26px;border:1px solid transparent;background:transparent;transition:background 200ms ease}
.tiles .w{background:rgba(11,11,11,0.8)}
.ic{width:56px;height:56px;border-radius:17px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;padding:0;cursor:pointer;pointer-events:auto}
.square .ic{background:#151515;box-shadow:0 0 0 1px #222222}
.ic:hover{box-shadow:0 0 0 1px #3a3a3a}
.mb{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent;border:0;padding:0;cursor:pointer}
.mb:hover{background:#1a1a1a}
.shk{width:84px;height:32px;flex-shrink:0;border-radius:16px;border:0;background:#1c1c1c;box-shadow:0 0 0 1px #2e2e2e;color:#DDDDDD;font:500 12.5px Inter,system-ui,sans-serif;cursor:pointer}
.shk:hover{background:#262626}
sc-for,sc-if{display:contents}
.mx{display:flex;gap:calc(var(--g) * 2.2)}
.mx .dg{display:grid;grid-template-columns:repeat(5,var(--d));grid-auto-rows:var(--d);gap:var(--g)}
.mx .cn{display:grid;grid-template-columns:var(--d);grid-auto-rows:var(--d);gap:var(--g)}
.mx .on,.mx .off{border-radius:50%}
.mx .on{background:#DDDDDD;box-shadow:0 0 5px rgba(221,221,221,0.35);animation:mxp 3.6s ease-in-out infinite}
.mx .on:nth-child(2n){animation-delay:-1.2s}
.mx .on:nth-child(3n){animation-delay:-2.4s}
.mx .off{background:#222222}
.mx .cn .on{animation:mxb 2s ease-in-out infinite}
.mxc{--d:5px;--g:4px}
@keyframes mxp{0%,100%{opacity:1}50%{opacity:0.72}}
@keyframes mxb{0%,100%{opacity:1}50%{opacity:0.25}}
</style>
</helmet>
<div style="width: 410px; height: 940px; box-sizing: border-box; padding: 34px 40px 0; background: #111111; display: flex; flex-direction: column; align-items: center; gap: 12px; font-family: Inter, system-ui, sans-serif; color: #ffffff">
<div style="position: relative; width: 330px; height: 810px; flex-shrink: 0; border-radius: 34px; overflow: hidden; background: #0B0B0B; color: #DDDDDD; box-shadow: 0 0 0 1px #2c2c2c" onPointerMove="{{ onMove }}" onPointerLeave="{{ onLeave }}">
<canvas id="dh-cover-cv" ref="{{ setCanvas }}" onPointerDown="{{ onTap }}" role="img" aria-label="Dot space shooter wallpaper" style="position: absolute; left: 0; top: 0; width: 330px; height: 810px; display: block; touch-action: none; cursor: crosshair"></canvas>
<div class="{{ layerClass }}" style="position: absolute; left: 0; top: 0; width: 330px; height: 810px; pointer-events: none">
<div style="position: absolute; right: 18px; top: 10px; font-size: 15px; font-weight: 400; color: #8E8E8E; letter-spacing: 0.3px">TODAY {{ score }} · BEST {{ best }}</div>
<div class="w" style="position: absolute; left: 12px; top: 20px; width: 306px; height: 196px; box-sizing: border-box; padding: 18px 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div class="mx mxc" role="img" aria-label="{{ time }}" style="padding: 6px 0 6px 2px"><sc-for list="{{ clock }}" as="b" hint-placeholder-count="5"><div class="{{ b.cls }}"><sc-for list="{{ b.cells }}" as="c" hint-placeholder-count="35"><div class="{{ c.c }}"></div></sc-for></div></sc-for></div>
<div style="font-size: 13px; color: #8E8E8E; padding-left: 3px">{{ date }}</div>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<svg class="ico" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.2 11 3.5 3.5 0 0 0 7 18z"></path></svg>
<div class="doto" style="font-size: 36px; line-height: 1; font-weight: 400; color: #DDDDDD">41°</div>
<div style="display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 12px; color: #DDDDDD">Cloudy · H 45° L 33°</div>
<div style="font-size: 12px; color: #8E8E8E">Chicago · sample data</div>
</div>
</div>
</div>
<div class="w" style="position: absolute; left: 12px; top: 580px; width: 306px; height: 120px; box-sizing: border-box; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 44px; height: 44px; border-radius: 11px; flex-shrink: 0; background-color: #0B0B0B; background-image: radial-gradient(circle, #DDDDDD 1.1px, transparent 1.6px); background-size: 6px 6px; box-shadow: 0 0 0 1px #222222"></div>
<div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<div style="font-size: 14px; font-weight: 500; color: #DDDDDD">Track name</div>
<div style="font-size: 12px; color: #8E8E8E">Artist</div>
</div>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<div style="height: 2px; background: #222222; border-radius: 1px; position: relative; flex-grow: 1"><div style="position: absolute; left: 0; top: 0; height: 2px; width: 38%; background: #DDDDDD; border-radius: 1px"></div></div>
<button class="mb" aria-label="Previous track"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6v12M18 6l-8 6 8 6z"></path></svg></button>
<button class="mb" aria-label="{{ playLabel }}" onClick="{{ togglePlay }}">
<sc-if value="{{ playing }}" hint-placeholder-val="{{ false }}"><svg class="icof" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="5.5" width="3.2" height="13" rx="1"></rect><rect x="13.8" y="5.5" width="3.2" height="13" rx="1"></rect></svg></sc-if>
<sc-if value="{{ paused }}" hint-placeholder-val="{{ true }}"><svg class="icof" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"></path></svg></sc-if>
</button>
<button class="mb" aria-label="Next track"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 6v12M6 6l8 6-8 6z"></path></svg></button>
</div>
</div>
<div class="{{ dockClass }}" style="position: absolute; left: 24px; top: 718px; width: 282px; height: 72px; display: flex; align-items: center; justify-content: space-between">
<button class="ic" aria-label="Messages"><canvas id="dh-cover-ic-messages" ref="{{ setIcon }}" width="56" height="56" aria-hidden="true" style="width: 56px; height: 56px; display: block"></canvas></button>
<button class="ic" aria-label="Mail"><canvas id="dh-cover-ic-mail" ref="{{ setIcon }}" width="56" height="56" aria-hidden="true" style="width: 56px; height: 56px; display: block"></canvas></button>
<button class="ic" aria-label="Browser"><canvas id="dh-cover-ic-browser" ref="{{ setIcon }}" width="56" height="56" aria-hidden="true" style="width: 56px; height: 56px; display: block"></canvas></button>
<button class="ic" aria-label="Music"><canvas id="dh-cover-ic-music" ref="{{ setIcon }}" width="56" height="56" aria-hidden="true" style="width: 56px; height: 56px; display: block"></canvas></button>
</div>
</div>
</div>
<div style="width: 330px; display: flex; align-items: flex-start; gap: 10px">
<button class="shk" aria-label="Shake" onClick="{{ shake }}">{{ shakeText }}</button>
<div style="font-size: 11.5px; color: #a0a0a0; line-height: 1.4">The ship flies itself · move the pointer to tilt (stars shift, debris falls) · click to shoot · Shake for a shockwave (8 s cooldown here, 60 s on the phone)</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dotSize":{"editor":"range","default":1.2,"min":0.8,"max":3.6,"step":0.1,"unit":"px","section":"Dots"},"dotSpacing":{"editor":"range","default":4,"min":3,"max":10,"step":0.5,"unit":"px","section":"Dots"},"widgetStyle":{"editor":"enum","default":"bare","options":["bare","tiles"],"section":"Style"},"iconStyle":{"editor":"enum","default":"glyph","options":["glyph","square"],"section":"Style"},"$preview":{"width":410,"height":940}}'>
class Component extends DCLogic {
  _dims() {
    return { W: 330, H: 810, ROCKS: 5, R: 26, CID: 'dh-cover-cv', IP: 'dh-cover-ic-', IC: 56,
      ICONS: ['messages', 'mail', 'browser', 'music'],
      zones: [[12, 20, 306, 196], [12, 580, 306, 120], [16, 712, 298, 84]] };
  }
  componentDidMount() {
    this.D = this._dims();
    this._alive = true;
    this._clock = setInterval(() => { this.setState({ now: Date.now() }); }, 10000);
    this._onOri = (e) => {
      const g = this._g;
      if (!g || e.gamma == null || e.beta == null) return;
      if (!g.ori) g.ori = { g0: e.gamma, b0: e.beta };
      g.oriOn = true;
      g.tilt.x = this._cl((e.gamma - g.ori.g0) / 22, -1, 1);
      g.tilt.y = this._cl((e.beta - g.ori.b0) / 22, -1, 1);
    };
    try { window.addEventListener('deviceorientation', this._onOri); } catch (err) {}
    this._findCanvas(0);
    this._findIcons(0);
  }
  componentWillUnmount() {
    this._alive = false;
    if (this._raf) cancelAnimationFrame(this._raf);
    clearInterval(this._clock);
    try { window.removeEventListener('deviceorientation', this._onOri); } catch (err) {}
  }
  _cl(v, a, b) { return v < a ? a : v > b ? b : v; }
  _DS() { const v = Number(this.props.dotSize); return isFinite(v) && v > 0 ? this._cl(v, 0.6, 5) : 1.2; }
  _S() { const v = Number(this.props.dotSpacing); return isFinite(v) && v > 0 ? this._cl(v, 2.5, 14) : 4; }
  _findCanvas(n) {
    if (!this._alive) return;
    if (!this._cv) { const el = document.getElementById(this.D.CID); if (el) this._cv = el; }
    if (this._cv) { this._start(); return; }
    if (n < 40) setTimeout(() => this._findCanvas(n + 1), 100);
  }
  _findIcons(n) {
    if (!this._alive) return;
    const D = this.D || this._dims();
    let left = 0;
    for (const name of D.ICONS) {
      const el = document.getElementById(D.IP + name);
      if (el) this._paintIcon(el); else left++;
    }
    if (left && n < 40) setTimeout(() => this._findIcons(n + 1), 100);
  }
  _icShape(x, name) {
    const grey = (L) => { const v = Math.round(L * 255); return 'rgb(' + v + ',' + v + ',' + v + ')'; };
    const rr = (x0, y0, w, h, r) => { x.beginPath(); x.moveTo(x0 + r, y0); x.arcTo(x0 + w, y0, x0 + w, y0 + h, r); x.arcTo(x0 + w, y0 + h, x0, y0 + h, r); x.arcTo(x0, y0 + h, x0, y0, r); x.arcTo(x0, y0, x0 + w, y0, r); x.closePath(); };
    if (name === 'messages') {
      x.fillStyle = grey(0.45);
      rr(98, 104, 236, 184, 60); x.fill();
      x.beginPath(); x.moveTo(134, 262); x.lineTo(112, 336); x.lineTo(198, 280); x.closePath(); x.fill();
    } else if (name === 'phone') {
      x.save(); x.translate(64, 56); x.scale(14.2, 14.2); x.fillStyle = grey(0.6);
      x.fill(new Path2D('M5 3.5h3l1.5 4-2 1.2a11 11 0 0 0 5.8 5.8l1.2-2 4 1.5v3a2 2 0 0 1-2 2A16 16 0 0 1 3 5.5a2 2 0 0 1 2-2z'));
      x.restore();
    } else if (name === 'mail') {
      rr(96, 128, 240, 176, 22); x.fillStyle = grey(0.8); x.fill();
      x.save(); rr(96, 128, 240, 176, 22); x.clip();
      x.beginPath(); x.moveTo(96, 128); x.lineTo(336, 128); x.lineTo(216, 230); x.closePath(); x.fillStyle = grey(0.4); x.fill();
      x.restore();
    } else if (name === 'browser') {
      const L = [0.35, 0.6, 0.85], step = (2 * Math.PI) / 3;
      for (let i = 0; i < 3; i++) { const a0 = -Math.PI / 2 + i * step; x.beginPath(); x.moveTo(216, 216); x.arc(216, 216, 122, a0, a0 + step); x.closePath(); x.fillStyle = grey(L[i]); x.fill(); }
      x.beginPath(); x.arc(216, 216, 62, 0, 2 * Math.PI); x.fillStyle = grey(0.95); x.fill();
      x.beginPath(); x.arc(216, 216, 46, 0, 2 * Math.PI); x.fillStyle = grey(0.5); x.fill();
    } else if (name === 'music') {
      x.beginPath(); x.arc(216, 216, 122, 0, 2 * Math.PI); x.fillStyle = grey(0.3); x.fill();
      x.beginPath(); x.moveTo(184, 150); x.lineTo(184, 282); x.lineTo(292, 216); x.closePath(); x.fillStyle = grey(0.95); x.fill();
    }
  }
  _icDots(name) {
    this._icCache = this._icCache || {};
    if (this._icCache[name]) return this._icCache[name];
    const S = 432, c = document.createElement('canvas');
    c.width = S; c.height = S;
    const x = c.getContext('2d', { willReadFrequently: true });
    if (!x) return [];
    this._icShape(x, name);
    const px = x.getImageData(0, 0, S, S).data, W1 = S + 1;
    const ia = new Float64Array(W1 * W1), il = new Float64Array(W1 * W1);
    for (let yy = 0; yy < S; yy++) {
      let ra = 0, rl = 0;
      for (let xx = 0; xx < S; xx++) {
        const o = (yy * S + xx) * 4, a = px[o + 3] / 255;
        const L = (0.2126 * px[o] + 0.7152 * px[o + 1] + 0.0722 * px[o + 2]) / 255;
        ra += a; rl += L * a;
        const k = (yy + 1) * W1 + xx + 1;
        ia[k] = ia[k - W1] + ra; il[k] = il[k - W1] + rl;
      }
    }
    const P = S / 30, B = P / 4, row = (P * Math.sqrt(3)) / 2, c0 = S / 2;
    const tot = ia[S * W1 + S], meanL = tot > 1e-9 ? il[S * W1 + S] / tot : 0.7;
    const box = (ii, cx, cy) => {
      const x0 = this._cl(Math.ceil(cx - B - 0.5), 0, S), x1 = this._cl(Math.floor(cx + B - 0.5) + 1, 0, S);
      const y0 = this._cl(Math.ceil(cy - B - 0.5), 0, S), y1 = this._cl(Math.floor(cy + B - 0.5) + 1, 0, S);
      return [ii[y1 * W1 + x1] - ii[y0 * W1 + x1] - ii[y1 * W1 + x0] + ii[y0 * W1 + x0], Math.max(1, (x1 - x0) * (y1 - y0))];
    };
    const half = Math.floor((c0 - P / 2) / row + 1e-9), lo = P / 2, hi = S - P / 2, dots = [];
    for (let j = -half; j <= half; j++) {
      const x0 = c0 + (j % 2 ? P / 2 : 0);
      const i0 = Math.ceil((lo - x0) / P - 1e-9), i1 = Math.floor((hi - x0) / P + 1e-9);
      for (let i = i0; i <= i1; i++) {
        const cx = x0 + i * P, cy = c0 + j * row;
        const cov = box(ia, cx, cy);
        if (cov[0] / cov[1] < 0.5) continue;
        const L = cov[0] > 0.01 * cov[1] ? box(il, cx, cy)[0] / cov[0] : meanL;
        const t = (0.38 + 0.57 * L) * (1 - (0.12 * (cx + cy)) / (2 * S));
        dots.push([cx, cy, Math.max(0.28 * P, 0.47 * P * Math.sqrt(Math.max(t, 0)))]);
      }
    }
    this._icCache[name] = dots;
    return dots;
  }
  _paintIcon(el) {
    if (!el || !el.id) return;
    const D = this.D || this._dims();
    const name = el.id.slice(D.IP.length);
    if (D.ICONS.indexOf(name) < 0) return;
    const dpr = this._cl(window.devicePixelRatio || 1, 1, 4), px = Math.round(D.IC * dpr);
    if (el._dhPx === px) return;
    const dots = this._icDots(name);
    el.width = px; el.height = px;
    const c = el.getContext('2d'); if (!c) return;
    el._dhPx = px;
    const sc = px / 432;
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, px, px);
    c.fillStyle = '#DDDDDD'; c.beginPath();
    for (const d of dots) { c.moveTo((d[0] + d[2]) * sc, d[1] * sc); c.arc(d[0] * sc, d[1] * sc, d[2] * sc, 0, 2 * Math.PI); }
    c.fill();
  }
  _start() {
    if (this._running || !this._cv || !this._alive) return;
    if (!this.D) this.D = this._dims();
    const ctx = this._cv.getContext('2d');
    if (!ctx) return;
    this._running = true;
    this._ctx = ctx;
    const D = this.D;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    this._dpr = dpr;
    this._cv.width = Math.round(D.W * dpr);
    this._cv.height = Math.round(D.H * dpr);
    this._initGame();
    let last = performance.now();
    const step = (now) => {
      if (!this._alive) { this._running = false; return; }
      let dt = (now - last) / 1000; last = now;
      if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
      this._update(dt);
      this._draw();
      this._raf = requestAnimationFrame(step);
    };
    this._raf = requestAnimationFrame(step);
  }
  _band() {
    const D = this.D, k = Math.sqrt(D.W * D.H) / 669;
    const zs = D.zones.slice().sort((a, b) => a[1] - b[1]);
    let cur = 0, lo = 0, hi = 0;
    for (const z of zs) { if (z[1] - cur > hi - lo) { lo = cur; hi = z[1]; } cur = Math.max(cur, z[1] + z[3]); }
    if (D.H - cur > hi - lo) { lo = cur; hi = D.H; }
    lo += 15 * k; hi -= 15 * k;
    if (hi - lo < 20 * k) { lo = 0.2 * D.H; hi = 0.8 * D.H; }
    return [lo, hi];
  }
  _initGame() {
    const D = this.D;
    const g = { t: 0, k: Math.sqrt(D.W * D.H) / 669, tilt: { x: 0, y: 0 }, oriOn: false, ori: null,
      ship: { x: D.W / 2, y: D.H * 0.54, vx: 0, vy: 0, a: -Math.PI / 2, cool: 0, fire: 0, aim: 0 },
      band: this._band(), wander: { x: D.W / 2, y: D.H / 2, t: 0 }, wave: null, shockCool: 0,
      rc: { bx: 0, by: 0, on: false }, parX: 0, parY: 0,
      rocks: [], shots: [], parts: [], rings: [], trail: [], trailT: 0, spawnT: 2, stars: [] };
    this._g = g;
    const n = Math.round((D.W * D.H) / 2300);
    for (let i = 0; i < n; i++) g.stars.push({ x: Math.random() * D.W, y: Math.random() * D.H, a: 0.05 + Math.random() * 0.3, p: Math.random() * 6.283, s: 0.3 + Math.random() * 0.9, d: 0.2 + Math.random() * 0.8 });
    for (let i = 0; i < D.ROCKS; i++) g.rocks.push(this._newRock(i % 3 === 2 ? 2 : 3, null, true));
  }
  _newRock(size, parent, anywhere) {
    const D = this.D, g = this._g, k = g.k;
    const r = D.R * (size === 3 ? 1 : size === 2 ? 0.62 : 0.38);
    let x, y, vx, vy;
    if (parent) {
      x = parent.x; y = parent.y;
      const ang = Math.random() * 6.283, sp = (18 + Math.random() * 26) * k;
      vx = parent.vx * 0.6 + Math.cos(ang) * sp; vy = parent.vy * 0.6 + Math.sin(ang) * sp;
    } else if (anywhere) {
      let tries = 0;
      do { x = Math.random() * D.W; y = Math.random() * D.H; tries++; } while (tries < 30 && Math.hypot(x - g.ship.x, y - g.ship.y) < 150 * k);
      const ang = Math.random() * 6.283, sp = (10 + Math.random() * 18) * k;
      vx = Math.cos(ang) * sp; vy = Math.sin(ang) * sp;
    } else {
      const side = Math.floor(Math.random() * 4);
      if (side === 0) { x = -r; y = Math.random() * D.H; }
      else if (side === 1) { x = D.W + r; y = Math.random() * D.H; }
      else if (side === 2) { x = Math.random() * D.W; y = -r; }
      else { x = Math.random() * D.W; y = D.H + r; }
      const tx = D.W * (0.25 + Math.random() * 0.5), ty = D.H * (0.25 + Math.random() * 0.5);
      const ang = Math.atan2(ty - y, tx - x), sp = (10 + Math.random() * 18) * k;
      vx = Math.cos(ang) * sp; vy = Math.sin(ang) * sp;
    }
    const nv = 9 + Math.floor(Math.random() * 4);
    const verts = [];
    for (let i = 0; i < nv; i++) { const a = (i / nv) * 6.2832; const rr = r * (0.72 + Math.random() * 0.4); verts.push([Math.cos(a) * rr, Math.sin(a) * rr]); }
    return { x: x, y: y, vx: vx, vy: vy, r: r, size: size, rot: Math.random() * 6.283, vr: (Math.random() - 0.5) * 0.5, verts: verts, dots: null, sp: 0 };
  }
  _rockDots(rock, S) {
    const pts = [], v = rock.verts;
    for (let i = 0; i < v.length; i++) {
      const a = v[i], b = v[(i + 1) % v.length];
      const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
      const n = Math.max(1, Math.round(L / S));
      for (let k = 0; k < n; k++) { const t = k / n; pts.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, 1]); }
    }
    const m = Math.round((rock.r * rock.r * 2.2) / (S * S * 3.2));
    for (let k = 0; k < m; k++) {
      const ang = Math.random() * 6.2832;
      const idx = Math.floor((ang / 6.2832) * v.length) % v.length;
