<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tilt glass widgets</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A6A6A6}a:hover{color:#DDDDDD}
.lb{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;line-height:16px;letter-spacing:1px;text-transform:uppercase;color:#A6A6A6;white-space:nowrap}
.ic{width:56px;height:56px;display:flex;align-items:center;justify-content:center;border:0;border-radius:0;background:transparent;padding:0;cursor:pointer;pointer-events:auto}
.tt{position:absolute;display:block;margin:0;padding:0;border:0;border-radius:20px;background:transparent;cursor:pointer;pointer-events:auto}
.tt:hover,.tt:focus-visible{outline:1px dashed rgba(255,255,255,0.22);outline-offset:-1px}
.mb{width:44px;height:44px;border-radius:22px;display:block;background:transparent;border:0;padding:0;cursor:pointer;pointer-events:auto}
.mb:hover,.mb:focus-visible{background:rgba(255,255,255,0.06);outline:0}
.shk{width:96px;height:32px;flex-shrink:0;border-radius:16px;border:0;background:#1A1A1A;color:#DDDDDD;font:500 13px Inter,system-ui,sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 700px; height: 900px; box-sizing: border-box; padding: 40px 40px 0; background: #111111; display: flex; flex-direction: column; align-items: center; gap: 16px; font-family: Inter, system-ui, sans-serif; color: #DDDDDD">
<div style="position: relative; width: 620px; height: 722px; flex-shrink: 0; border-radius: 36px; overflow: hidden; background: #000000; color: #DDDDDD; box-shadow: 0 0 0 1px #2c2c2c" onPointerMove="{{ onMove }}" onPointerLeave="{{ onLeave }}">
<canvas id="dh-tg-cv" ref="{{ setCanvas }}" role="img" aria-label="Live wallpaper drawing its own glass widget cards: a dot-matrix clock with seconds, the date and weather, and a music card" style="position: absolute; left: 0; top: 0; width: 620px; height: 722px; display: block; touch-action: none"></canvas>
<div style="position: absolute; left: 0; top: 0; width: 620px; height: 722px; pointer-events: none">
<button class="tt" aria-label="{{ clockLabel }}" style="left: 24px; top: 28px; width: 404px; height: 160px"></button>
<button class="tt" aria-label="Weather: 48 degrees, cloudy, Chicago" style="left: 432px; top: 28px; width: 164px; height: 160px"></button>
<div class="lb" style="position: absolute; left: 24px; top: 208px">TODAY {{ score }} · BEST {{ best }}</div>
<button class="tt" aria-label="Open music: Track name by Artist" style="left: 24px; top: 504px; width: 424px; height: 88px"></button>
<div style="position: absolute; left: 456px; top: 526px; display: flex">
<button class="mb" aria-label="Previous track"></button>
<button class="mb" aria-label="{{ playLabel }}" onClick="{{ togglePlay }}"></button>
<button class="mb" aria-label="Next track"></button>
</div>
<div style="position: absolute; left: 24px; top: 632px; display: flex; gap: 72px">
<button class="ic" aria-label="Messages"><canvas id="dh-tg-ic-messages" ref="{{ setIcon }}" width="56" height="56" aria-hidden="true" style="width: 56px; height: 56px; display: block"></canvas></button>
<button class="ic" aria-label="Phone"><canvas id="dh-tg-ic-phone" ref="{{ setIcon }}" width="56" height="56" aria-hidden="true" style="width: 56px; height: 56px; display: block"></canvas></button>
<button class="ic" aria-label="Mail"><canvas id="dh-tg-ic-mail" ref="{{ setIcon }}" width="56" height="56" aria-hidden="true" style="width: 56px; height: 56px; display: block"></canvas></button>
<button class="ic" aria-label="Browser"><canvas id="dh-tg-ic-browser" ref="{{ setIcon }}" width="56" height="56" aria-hidden="true" style="width: 56px; height: 56px; display: block"></canvas></button>
<button class="ic" aria-label="Music"><canvas id="dh-tg-ic-music" ref="{{ setIcon }}" width="56" height="56" aria-hidden="true" style="width: 56px; height: 56px; display: block"></canvas></button>
</div>
</div>
</div>
<div style="width: 620px; display: flex; align-items: flex-start; gap: 16px">
<button class="shk" aria-label="Shake" onClick="{{ shake }}">{{ shakeText }}</button>
<div style="font-size: 13px; line-height: 20px; color: #A6A6A6">Wallpaper-drawn widgets: the reflection follows tilt (move the pointer) and the seconds tick. Real widgets would be invisible tap targets on top.</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"glassMode":{"editor":"enum","default":"tilt","options":["tilt","static"],"section":"Glass"},"reflectStrength":{"editor":"range","default":0.16,"min":0,"max":0.3,"step":0.01,"section":"Glass"},"$preview":{"width":700,"height":900}}'>
class Component extends DCLogic {
  _dims() {
    return { W: 620, H: 722, ROCKS: 7, R: 34, CID: 'dh-tg-cv', IP: 'dh-tg-ic-', IC: 56,
      ICONS: ['messages', 'phone', 'mail', 'browser', 'music'],
      // Lattice clear zones (score line, dock). The cards are NOT zones: rocks pass under the glass.
      zones: [[24, 208, 156, 16], [24, 632, 568, 56]],
      cards: [{ x: 20, y: 24, w: 580, h: 168, r: 24 }, { x: 20, y: 500, w: 580, h: 96, r: 24 }],
      CK: { x0: 47, y0: 62, s: 10 } };
  }
  componentDidMount() {
    this.D = this._dims();
    this._alive = true;
    this._clock = setInterval(() => { this.setState({ now: Date.now() }); }, 10000);
    this._onOri = (e) => {
      const g = this._g;
      if (!g || e.gamma == null || e.beta == null) return;
      if (!g.ori) g.ori = { g0: e.gamma, b0: e.beta };
      g.oriOn = true;
      g.tilt.x = this._cl((e.gamma - g.ori.g0) / 22, -1, 1);
      g.tilt.y = this._cl((e.beta - g.ori.b0) / 22, -1, 1);
    };
    try { window.addEventListener('deviceorientation', this._onOri); } catch (err) {}
    try {
      if (document.fonts && document.fonts.load) {
        for (const f of ['400 13px Inter', '400 15px Inter', '500 15px Inter']) { const p = document.fonts.load(f); if (p && p.catch) p.catch(() => {}); }
      }
    } catch (err) {}
    this._findCanvas(0);
    this._findIcons(0);
  }
  componentWillUnmount() {

  _cl(v, a, b) { return v < a ? a : v > b ? b : v; }

  }
  // The app's 5x7 matrix font (DotMatrixFont): digits share one 5-column advance, the colon is one column
  _mxF() {

    return this._F;
  }
  _hhmm(d) { let h = d.getHours() % 12; if (h === 0) h = 12; return String(h).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

  // Clear zones: lattice cells inside a zone stay off; within 16 px of its edge they thin out in a fixed 4x4 ordered dither

    const i0 = Math.max(0, Math.ceil((x0 - 2) / S)), i1 = Math.min(NI, Math.floor((x1 + 2) / S));
    const j0 = Math.max(0, Math.ceil((y0 - 2) / S)), j1 = Math.min(NJ, Math.floor((y1 + 2) / S));
    for (let j = j0; j <= j1; j++) {
      const cy = j * S;
      for (let i = i0; i <= i1; i++) {
        if (Z && Z.mask[j * Z.N1 + i]) continue;
        const cx = i * S;
        let ins = false, dm = 1e9;
        for (let k = 0, l = n - 1; k < n; l = k++) {
          const ax = poly[l][0], ay = poly[l][1], bx = poly[k][0], by = poly[k][1], ex = bx - ax, ey = by - ay;
          if ((ay > cy) !== (by > cy) && cx < (ex * (cy - ay)) / ey + ax) ins = !ins;
          const wx = cx - ax, wy = cy - ay, ee = ex * ex + ey * ey;
          let u = ee > 0 ? (wx * ex + wy * ey) / ee : 0;
          u = u < 0 ? 0 : u > 1 ? 1 : u;
          const dx = wx - ex * u, dy = wy - ey * u, d2 = dx * dx + dy * dy;
          if (d2 < dm) dm = d2;
        }
        const sd = ins ? -Math.sqrt(dm) : Math.sqrt(dm);
        if (sd >= S / 2) continue;
        if (solid || sd > -S) { const cov = 0.5 - sd / S; put(cx, cy, 0.6 * S * (cov > 1 ? 1 : cov), a); }

    }
  }
  _findCanvas(n) {
    if (!this._alive) return;

    if (n < 40) setTimeout(() => this._findCanvas(n + 1), 100);
  }
  _findIcons(n) {
    if (!this._alive) return;
    const D = this.D || this._dims();
    let left = 0;
    for (const name of D.ICONS) {
      const el = document.getElementById(D.IP + name);
      if (el) this._paintIcon(el); else left++;
    }
    if (left && n < 40) setTimeout(() => this._findIcons(n + 1), 100);
  }
  _icShape(x, name) {
    const grey = (L) => { const v = Math.round(L * 255); return 'rgb(' + v + ',' + v + ',' + v + ')'; };
    const rr = (x0, y0, w, h, r) => { x.beginPath(); x.moveTo(x0 + r, y0); x.arcTo(x0 + w, y0, x0 + w, y0 + h, r); x.arcTo(x0 + w, y0 + h, x0, y0 + h, r); x.arcTo(x0, y0 + h, x0, y0, r); x.arcTo(x0, y0, x0 + w, y0, r); x.closePath(); };
    if (name === 'messages') {
      x.fillStyle = grey(0.45);
      rr(98, 104, 236, 184, 60); x.fill();
      x.beginPath(); x.moveTo(134, 262); x.lineTo(112, 336); x.lineTo(198, 280); x.closePath(); x.fill();
    } else if (name === 'phone') {
      x.save(); x.translate(64, 56); x.scale(14.2, 14.2); x.fillStyle = grey(0.6);
      x.fill(new Path2D('M5 3.5h3l1.5 4-2 1.2a11 11 0 0 0 5.8 5.8l1.2-2 4 1.5v3a2 2 0 0 1-2 2A16 16 0 0 1 3 5.5a2 2 0 0 1 2-2z'));
      x.restore();
    } else if (name === 'mail') {
      rr(96, 128, 240, 176, 22); x.fillStyle = grey(0.8); x.fill();
      x.save(); rr(96, 128, 240, 176, 22); x.clip();
      x.beginPath(); x.moveTo(96, 128); x.lineTo(336, 128); x.lineTo(216, 230); x.closePath(); x.fillStyle = grey(0.4); x.fill();
      x.restore();

      for (let i = 0; i < 3; i++) { const a0 = -Math.PI / 2 + i * step; x.beginPath(); x.moveTo(216, 216); x.arc(216, 216, 122, a0, a0 + step); x.closePath(); x.fillStyle = grey(L[i]); x.fill(); }

      x.beginPath(); x.arc(216, 216, 46, 0, 2 * Math.PI); x.fillStyle = grey(0.5); x.fill();
    } else if (name === 'music') {
      x.beginPath(); x.arc(216, 216, 122, 0, 2 * Math.PI); x.fillStyle = grey(0.3); x.fill();

  _icDots(name) {

    c.width = S; c.height = S;
    const x = c.getContext('2d', { willReadFrequently: true });

    const px = x.getImageData(0, 0, S, S).data, W1 = S + 1;

  _paintIcon(el) {

  // The ship's open band: the widest vertical gap between the cards and zones
  _band() {

  _initGame() {
    const D = this.D;

      ship: { x: D.W / 2, y: D.H * 0.54, vx: 0, vy: 0, a: -Math.PI / 2, cool: 0, aim: 0 },
      band: this._band(), wander: { x: D.W / 2, y: D.H / 2, t: 0 }, wave: null, shockCool: 0,
      rc: { bx: 0, by: 0, on: false }, parX: 0, parY: 0,

  // Seconds tick: newly lit cells gather in (0.25 s, cubic ease-out); cells that go dark scatter as free dots (0.4 s fade)
  _ckStep(dt) {
    const ck = this._ck || (this._ck = { str: '', born: {}, free: [] });
    const str = this._hms(new Date());
    if (str !== ck.str) {
      if (ck.str.length === str.length) {
        const F = this._mxF(), C = this.D.CK, xs = this._ckXs(str);
        for (let i = 0; i < str.length; i++) {
          const A = F[ck.str[i]], B = F[str[i]];
          if (ck.str[i] === str[i] || !A || !B) continue;
          const w = B[0].length, cxm = xs[i] + ((w - 1) * C.s) / 2, cym = C.y0 + 3 * C.s;
          for (let r = 0; r < 7; r++) {
            for (let c = 0; c < w; c++) {
              const on0 = A[r].charAt(c) === '1', on1 = B[r].charAt(c) === '1';
              const x = xs[i] + c * C.s, y = C.y0 + r * C.s;
              if (on1 && !on0) {
                const ang = Math.random() * 6.2832;
                ck.born[i + ':' + r + ':' + c] = { t: 0, ox: Math.cos(ang) * 4, oy: Math.sin(ang) * 4 };
              } else if (on0 && !on1) {
                const dx = x - cxm, dy = y - cym, dd = Math.hypot(dx, dy) || 1, sp = 10 + Math.random() * 22, ang = Math.random() * 6.2832;
                ck.free.push({ x: x, y: y, vx: (dx / dd) * sp + Math.cos(ang) * 8, vy: (dy / dd) * sp + Math.sin(ang) * 8, life: 0.4 });
              }
            }
          }
        }
      }
      ck.str = str;
    }
    for (const key in ck.born) { const b = ck.born[key]; b.t += dt; if (b.t >= 0.25) delete ck.born[key]; }
    for (const p of ck.free) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    ck.free = ck.free.filter((p) => p.life > 0);
  }
  _ckDraw(ctx) {
    const ck = this._ck;
    if (!ck || !ck.str) return;
    const F = this._mxF(), C = this.D.CK, s = C.s, str = ck.str, xs = this._ckXs(str), rd = s * 0.3;
    const lit = [], anim = [];
    ctx.fillStyle = '#1A1A1A'; ctx.beginPath();
    for (let i = 0; i < str.length; i++) {
      const rows = F[str[i]];
      if (!rows) continue;
      const w = rows[0].length;
      for (let r = 0; r < 7; r++) {
        for (let c = 0; c < w; c++) {
          const x = xs[i] + c * s, y = C.y0 + r * s, b = ck.born[i + ':' + r + ':' + c];
          if (rows[r].charAt(c) === '1' && !b) { lit.push(x, y); continue; }
          if (b) anim.push(x, y, b);
          ctx.moveTo(x + rd, y); ctx.arc(x, y, rd, 0, 6.2832);
        }
      }
    }
    ctx.fill();
    ctx.fillStyle = '#DDDDDD'; ctx.beginPath();
    for (let q = 0; q < lit.length; q += 2) { ctx.moveTo(lit[q] + rd, lit[q + 1]); ctx.arc(lit[q], lit[q + 1], rd, 0, 6.2832); }
    ctx.fill();
    for (let q = 0; q < anim.length; q += 3) {
      const b = anim[q + 2], u = Math.min(1, b.t / 0.25), e = 1 - Math.pow(1 - u, 3), r = rd * e;
      if (r < 0.05) continue;
      ctx.globalAlpha = e; ctx.beginPath(); ctx.arc(anim[q] + b.ox * (1 - e), anim[q + 1] + b.oy * (1 - e), r, 0, 6.2832); ctx.fill();
    }
    for (const p of ck.free) {
      const q = p.life / 0.4;
      ctx.globalAlpha = 0.85 * q; ctx.beginPath(); ctx.arc(p.x, p.y, rd * (0.6 + 0.4 * q), 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  _tp() {
    if (this._tpc !== undefined) return this._tpc;
    try {
      this._tpc = { prev: new Path2D('M7 6v12M18 6l-8 6 8 6z'), next: new Path2D('M17 6v12M6 6l8 6-8 6z'), play: new Path2D('M8 5.5v13l10.5-6.5z'), pause: new Path2D('M9 6v12M15 6v12') };
    } catch (err) { this._tpc = null; }
    return this._tpc;
  }
  // Date, weather and the music card, all drawn by the wallpaper
  _cardInk(ctx) {
    const st = this.state || {};
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.font = '400 15px Inter, system-ui, sans-serif'; ctx.fillStyle = '#A6A6A6';
    ctx.fillText(this._dateStr(new Date()), 44, 156);
    ctx.font = '400 13px Inter, system-ui, sans-serif';
    const a = '48° Cloudy', b = ' · Chicago', w1 = ctx.measureText(a).width, w2 = ctx.measureText(b).width, x = 576 - w1 - w2;
    ctx.fillText(a, x, 69);
    ctx.fillStyle = '#757575'; ctx.fillText(b, x + w1, 69);
    ctx.font = '500 15px Inter, system-ui, sans-serif'; ctx.fillStyle = '#DDDDDD';
    ctx.fillText('Track name', 44, 543);
    ctx.font = '400 13px Inter, system-ui, sans-serif'; ctx.fillStyle = '#A6A6A6';
    ctx.fillText('Artist', 44, 563);
    const P = this._tp();
    if (!P) return;
    const k = 22 / 24, ic = [[P.prev, 478], [st.playing ? P.pause : P.play, 522], [P.next, 566]];
    ctx.strokeStyle = '#DDDDDD'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const q of ic) {
      ctx.save(); ctx.translate(q[1] - 11, 548 - 11); ctx.scale(k, k); ctx.lineWidth = 1.6 / k; ctx.stroke(q[0]); ctx.restore();
    }
  }
  renderVals() {
    if (!this._h) {
      this._h = {
        setCanvas: (el) => { if (el) { this._cv = el; if (this._alive) this._start(); } },
        onMove: (e) => {
          const g = this._g; if (!g || g.oriOn) return;
          const r = e.currentTarget.getBoundingClientRect(); if (!r.width) return;
          const x = ((e.clientX - r.left) / r.width) * 2 - 1, y = ((e.clientY - r.top) / r.height) * 2 - 1;
          const dz = (v) => (Math.abs(v) < 0.08 ? 0 : (v - Math.sign(v) * 0.08) / 0.92);
          g.tilt.x = this._cl(dz(x) * 1.3, -1, 1); g.tilt.y = this._cl(dz(y) * 1.3, -1, 1);
        },
        onLeave: () => { const g = this._g; if (g && !g.oriOn) { g.tilt.x = 0; g.tilt.y = 0; } },
        shake: () => this._shock(),
        togglePlay: () => { const st = this.state || {}; this.setState({ playing: !st.playing }); },
        setIcon: (el) => { if (el) this._paintIcon(el); }
      };
    }
    const st = this.state || {};
    const d = new Date(st.now || Date.now());
    const left = st.shakeLeft || 0;
    return {
      setCanvas: this._h.setCanvas, onMove: this._h.onMove, onLeave: this._h.onLeave, togglePlay: this._h.togglePlay,
      setIcon: this._h.setIcon, shake: this._h.shake, shakeText: left > 0 ? 'Shake · ' + left + ' s' : 'Shake',
      clockLabel: 'Clock: ' + this._hhmm(d) + ', ' + this._dateStr(d), score: st.score || 0, best: st.best || 0,
      playLabel: st.playing ? 'Pause' : 'Play'
    };
  }
}
